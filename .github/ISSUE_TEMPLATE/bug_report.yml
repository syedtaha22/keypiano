name: Bug Report
description: Something isn't working correctly in KeyPiano
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much detail as you can — it helps a lot.

  - type: input
    id: version
    attributes:
      label: KeyPiano version
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS version
      placeholder: "e.g. Windows 11 23H2 / macOS 14.4 / Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Click ...
        3. Press ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened instead?
    validations:
      required: true

  - type: dropdown
    id: keyboard_mode
    attributes:
      label: Keyboard mode when the bug occurred
      options:
        - Standard
        - Strict Rows
        - Pro
        - Not applicable / unsure

  - type: textarea
    id: console_errors
    attributes:
      label: Console errors
      description: |
        Open DevTools (Ctrl+Shift+I on Windows/Linux, Cmd+Option+I on macOS) and paste any errors from the Console tab.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, or additional context.
